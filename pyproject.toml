[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-research"
version = "0.1.0"
description = "Foundation data platform for quantitative research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "baostock",
    "duckdb",
    "numpy",
    "polars",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy",
    "typer",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]

[project.scripts]
quant = "quant_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
