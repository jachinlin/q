name: ETF 月频动量轮动
description: 固定 ETF 池按前复权区间收益排序并持有前两名
tags: [etf, rotation]
start_date: 2018-01-01
end_date: 2024-12-31
strategy:
  strategy_id: etf_rotation
  parameters:
    pipeline:
      frequency: MONTHLY
      target_tolerance: 0.001
      alpha:
        model_id: multi_factor_composite
        params:
          etf_pool: [510050.SH, 510300.SH, 513100.SH, 588000.SH]
          momentum_windows: [20, 60, 120]
          momentum_weights: [0.2, 0.3, 0.5]
          trend_window: 60
          trend_weight: 0.5
          volatility_window: 20
          volatility_weight: 0.5
      risk: {model_id: none}
      cost: {model_id: fixed_bps}
      construction: {model_id: top_n_equal_weight, params: {top_n: 2}}
      constraints:
        model_id: long_only
        params:
          min_positions: 1
          max_positions: 2
          max_position_weight: 0.5
          max_turnover: 1.0
          max_industry_weight: 1.0
          min_adv_amount: 0.0
          long_exposure: 1.0
benchmark: 000300.SH
initial_cash_fen: 100000000
execution:
  reference_price: OPEN
  slippage_bps: 5.0
  max_volume_participation: 0.1
  limit_order_policy: REJECT
