name: 股票多因子周频回测
description: 价值与动量复合分数的纯多头等权组合
tags: [equity, multifactor]
start_date: 2018-01-01
end_date: 2024-12-31
strategy:
  strategy_id: stock_multifactor
  parameters:
    pipeline:
      frequency: WEEKLY
      target_tolerance: 0.001
      alpha:
        model_id: multi_factor_composite
        params:
          factor_weights:
            book_to_price_mrq: 0.5
            momentum_120_20: 0.5
          min_valid_factors: 2
      risk: {model_id: none}
      cost: {model_id: fixed_bps}
      construction: {model_id: top_n_equal_weight, params: {top_n: 20}}
      constraints:
        model_id: long_only
        params:
          min_positions: 10
          max_positions: 20
          max_position_weight: 0.05
          max_turnover: 0.4
          max_industry_weight: 0.3
          min_adv_amount: 50000000.0
          long_exposure: 1.0
benchmark: 000300.SH
initial_cash_fen: 100000000
execution:
  reference_price: OPEN
  slippage_bps: 5.0
  max_volume_participation: 0.1
  limit_order_policy: REJECT
